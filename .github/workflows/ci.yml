name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/api/requirements.txt
      - run: ruff check apps/api/biti --config apps/api/pyproject.toml
      - run: pytest apps/api/tests
      - name: OpenAPI export
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "apps/api")
          os.environ["BITI_DEMO_MODE"] = "true"
          os.environ["BITI_ENV"] = "development"
          from biti.main import app
          data = app.openapi()
          assert data["info"]["title"] == "Biti Hebrew"
          print("openapi paths", len(data["paths"]))
          PY
      - name: Seed lesson count
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "apps/api")
          from biti.seed import all_lesson_specs, validate_lesson
          specs = all_lesson_specs()
          assert len(specs) >= 24
          assert not [e for s in specs for e in validate_lesson(s)]
          print("lessons", len(specs))
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r apps/api/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright + axe
        env:
          CI: "true"
          E2E_PYTHON: python
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
            e2e/test-results
            e2e/playwright-report

  license-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f docs/content-licensing.md && test -f docs/versions.md && test -f docs/color-research.md
